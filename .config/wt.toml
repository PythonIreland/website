# Worktrunk project configuration (https://worktrunk.dev).
#
# Gives every worktree its own Docker Compose environment so several branches
# can run `task run` / `task tests` side by side. docker-compose.yml and the
# Taskfile read the `.env` written below and fall back to the historical
# defaults (port 8000, image python.ie/website-dev) when it is absent, so
# nothing changes for contributors who do not use worktrunk.
#
# The naming templates in pre-start and post-remove must stay in sync.

# Blocking, so the `.env` exists before anyone runs docker compose in the new
# worktree. It pins, per branch:
# - COMPOSE_PROJECT_NAME: namespaces containers, networks and volumes
#   (including the Postgres data volume), so each worktree has its own database;
# - DOCKER_IMAGE: a per-branch tag, so rebuilding the image on a branch that
#   changes dependencies does not break the other worktrees;
# - WEB_PORT / PGPORT: deterministic host ports (hash_port), so published ports
#   never collide. PGPORT is also what psql / `task database:pull` use on the host.
[pre-start]
env = """
cat > .env <<EOF
# Generated by the worktrunk pre-start hook (.config/wt.toml) for {{ branch }}.
# Regenerate with: wt hook pre-start
COMPOSE_PROJECT_NAME=pythonie-{{ branch | sanitize_db }}
DOCKER_IMAGE=python.ie/website-dev:{{ branch | sanitize_db }}
WEB_PORT={{ branch | hash_port }}
PGPORT={{ ('pg-' ~ branch) | hash_port }}
EOF
"""

# Background: prepares the host virtualenv (.venv) of the new worktree so that
# `uv run ruff ...`, local tests and editors work right away.
[post-start]
deps = "uv sync --all-groups"

# Background, after the worktree is gone (runs from the primary worktree).
# DESTRUCTIVE: removes the containers, network and volumes (Postgres and Redis
# data) of this worktree's compose project, then its per-branch image. `-p`
# restricts it to that single project; other worktrees and the primary
# checkout use different project names and are never touched.
[post-remove]
docker = """
docker compose -p pythonie-{{ branch | sanitize_db }} down --volumes --remove-orphans
docker image rm python.ie/website-dev:{{ branch | sanitize_db }} 2>/dev/null || true
"""

# Shows each worktree's dev server URL in `wt list` (matches WEB_PORT above).
[list]
url = "http://localhost:{{ branch | hash_port }}"
