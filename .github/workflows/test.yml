name: Test packages
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Run code quality checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: pythonie.settings.tests
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting with Ruff
        run: uv run ruff format --check pythonie

      - name: Lint code with Ruff
        run: uv run ruff check pythonie

      - name: Check for security vulnerabilities
        run: uv run pip-audit

      - name: Run Django tests
        run: uv run python pythonie/manage.py test pythonie --verbosity=2
