services:
  web:
    build: .
    # Image, host ports and the compose project name can be overridden from a
    # `.env` file next to this one (worktrunk writes it for every worktree, see
    # .config/wt.toml). The defaults below apply when there is no `.env`.
    image: ${DOCKER_IMAGE:-python.ie/website-dev}
    ports:
      - "${WEB_PORT:-8000}:8000"
    command: /usr/bin/fish
    depends_on:
      - postgres
      - redis
    env_file:
      - development.env
    environment:
#       DJANGO_SETTINGS_MODULE: pythonie.settings.dev
      PGDATABASE: pythonie
      PGUSER: postgres
      PGPASSWORD: pythonie
    volumes:
      - .:/app
    working_dir: /app


  postgres:
    image: postgres:17
    ports:
      - "${PGPORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: pythonie

  redis:
    image: redis:6.2

  test:
    image: ${DOCKER_IMAGE:-python.ie/website-dev}
    environment:
      DJANGO_SETTINGS_MODULE: pythonie.settings.tests
    volumes:
      - .:/app
    working_dir: /app
    command: python pythonie/manage.py test pythonie --verbosity=3
