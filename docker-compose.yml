services:
  web:
    image: python.ie/website-dev
    ports:
      - "8000:8000"
    command: /usr/bin/fish
    depends_on:
      - postgres
      - redis
    env_file:
      - development.env
    environment:
#       DJANGO_SETTINGS_MODULE: pythonie.settings.dev
      PGDATABASE: pythonie
      PGUSER: postgres
      PGPASSWORD: pythonie
    volumes:
      - .:/app
    working_dir: /app


  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: pythonie

  redis:
    image: redis:6.2

  test:
    image: python.ie/website-dev
    environment:
      DJANGO_SETTINGS_MODULE: pythonie.settings.tests
    volumes:
      - .:/app
    working_dir: /app
    command: python pythonie/manage.py test pythonie --verbosity=3
