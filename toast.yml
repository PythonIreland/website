image: python.ie/website-dev
tasks:
  deps:compute:
    description: Compute the dependencies
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: uv lock

  deps:outdated:
    description: Show the outdated dependencies
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: uv tree --outdated

  deps:upgrade:
    description: Upgrade the dependencies
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: uv lock --upgrade

  deps:upgrade:django:
    description: Upgrade Django to the latest compatible version
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: uv lock --upgrade-package django

  deps:upgrade:wagtail:
    description: Upgrade Wagtail to the latest compatible version
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: uv lock --upgrade-package wagtail

  deps:security:
    description: Check dependencies for known security vulnerabilities
    cache: false
    command: uv run pip-audit

  deps:tree:
    description: Show the dependencies tree
    cache: false
    command: uv tree

  code:format:
    description: Format the code
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: |
      python -m ruff format pythonie

  code:lint:
    description: Lint the code and fix issues
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: |
      python -m ruff check --fix pythonie

  code:check:
    description: Check code formatting and linting without changes
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: |
      python -m ruff format --check pythonie
      python -m ruff check pythonie

  fish:
    description: Run a shell
    cache: false
    mount_paths:
      - .:/app
    location: /app
    command: /usr/bin/fish
