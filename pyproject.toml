[project]
name = "pythonie"
version = "0.1.0"
description = "Python Ireland website (python.ie / pycon.ie), built with Django and Wagtail CMS"
requires-python = "==3.13.*"
dependencies = [
    "boto3>=1.43.102",
    "colander>=2.0",
    "defusedxml>=0.7.1",
    "delorean>=2.0.0",
    "dj-database-url>=3.1.2",
    "dj-static>=0.0.6",
    "django>=6.0.8,<6.1", # pinned to the 6.0.x branch, matches the currently deployed version
    "django-compressor>=4.6.0",
    "django-extensions>=4.1",
    "django-libsass>=0.9",
    "django-modelcluster>=6.5",
    "django-storages>=1.14.6",
    "django-taggit>=6.1.0",
    "gunicorn>=26.2.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "wagtail>=7.3.4,<7.4",
    "whitenoise>=6.12.0",
    "willow>=1.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "django-debug-toolbar>=8.0.0",
    "fakeredis>=2.38.0",
    "isort>=9.0.1",
    "model_mommy>=2.0.0",
    "pip-audit>=2.10.1",
    "pipdeptree>=4.2.5",
    "ruff==0.16.9", # pinned: ruff minor releases change the default lint rule set
    "uv>=0.12.19",
    "wagtail-factories>=4.5.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# RUF012 flags the Django/Wagtail class-attribute idioms (Meta, migrations
# operations/dependencies, content_panels) that are never mutated.
extend-ignore = ["RUF012"]

[tool.coverage.run]
branch = true
source = ["pythonie"]
